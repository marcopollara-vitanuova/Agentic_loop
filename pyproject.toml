[project]
name = "agentic-loop"
version = "0.1.0"
description = "An explicit, auditable agentic loop over the Claude Messages API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0,<2",
]

[project.scripts]
agentic-loop = "agentic_loop.cli:_run"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
# The Anthropic client is injected as `Any` on purpose: the loop is tested
# against a fake client, so it must not be bound to the SDK's concrete types.
disallow_any_explicit = false
